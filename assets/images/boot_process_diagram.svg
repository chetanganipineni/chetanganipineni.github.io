<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 180" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="fwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c757d"/>
      <stop offset="100%" stop-color="#495057"/>
    </linearGradient>
    <linearGradient id="kernGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="100%" stop-color="#c4872a"/>
    </linearGradient>
    <linearGradient id="initGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d35f5f"/>
      <stop offset="100%" stop-color="#b04444"/>
    </linearGradient>
    <linearGradient id="mountGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="100%" stop-color="#3a7bbf"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#5041c1"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1793d1"/>
      <stop offset="100%" stop-color="#0e6ea1"/>
    </linearGradient>
  </defs>

  <rect x="20" y="42" width="110" height="60" rx="8" fill="url(#fwGrad)" stroke="#3a3f44" stroke-width="1.5"/>
  <text x="75" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">UEFI</text>
  <text x="75" y="82" text-anchor="middle" fill="#dfe4ea" font-size="10">Firmware</text>

  <line x1="130" y1="72" x2="160" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="42" width="150" height="60" rx="8" fill="url(#fwGrad)" stroke="#3a3f44" stroke-width="1.5"/>
  <text x="235" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">systemd-boot</text>
  <text x="235" y="82" text-anchor="middle" fill="#dfe4ea" font-size="10">Bootloader</text>

  <line x1="310" y1="72" x2="340" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="42" width="150" height="60" rx="8" fill="url(#kernGrad)" stroke="#a06e20" stroke-width="1.5"/>
  <text x="415" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Linux Kernel</text>
  <text x="415" y="82" text-anchor="middle" fill="#fff3cd" font-size="10">vmlinuz</text>

  <line x1="490" y1="72" x2="520" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="42" width="135" height="60" rx="8" fill="url(#initGrad)" stroke="#8a3333" stroke-width="1.5"/>
  <text x="587.5" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">initramfs</text>
  <text x="587.5" y="82" text-anchor="middle" fill="#ffdada" font-size="10">RAM root</text>

  <line x1="655" y1="72" x2="685" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="685" y="42" width="170" height="60" rx="8" fill="url(#mountGrad)" stroke="#2d6999" stroke-width="1.5"/>
  <text x="770" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Mount real fs</text>
  <text x="770" y="82" text-anchor="middle" fill="#dfefff" font-size="10">(/)</text>

  <line x1="855" y1="72" x2="885" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="885" y="42" width="110" height="60" rx="8" fill="url(#sysGrad)" stroke="#3d31a0" stroke-width="1.5"/>
  <text x="940" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">systemd</text>
  <text x="940" y="82" text-anchor="middle" fill="#e3dfff" font-size="10">PID 1</text>

  <line x1="995" y1="72" x2="1025" y2="72" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1025" y="42" width="180" height="60" rx="8" fill="url(#archGrad)" stroke="#0a5a82" stroke-width="1.5"/>
  <text x="1115" y="66" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Arch Linux</text>
  <text x="1115" y="82" text-anchor="middle" fill="#d9f0ff" font-size="10">Normal userspace</text>
</svg>
